name: Xueqiu email monitor

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'diagnose = source probe only; bootstrap = one-time migration; check = normal run'
        required: true
        type: choice
        default: check
        options: [check, check-and-confirm, diagnose, bootstrap]
  schedule:
    # UTC 22:00..23:55 and 00:00..14:55 = Beijing 06:00..22:55.
    - cron: '0,5,10,15,20,25,30,35,40,45,50,55 0-14,22-23 * * *'
    # Final Beijing 23:00 check.
    - cron: '00 15 * * *'

permissions: {}
concurrency:
  group: public-timeline-monitor
  cancel-in-progress: false

jobs:
  monitor:
    if: github.event_name == 'workflow_dispatch' || vars.MONITOR_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: write
      actions: write
    env:
      TZ: Asia/Shanghai
      GH_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      MONITOR_RECIPIENT: ${{ secrets.MONITOR_RECIPIENT }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      MONITOR_SEED_STATE_GZ: ${{ secrets.MONITOR_SEED_STATE_GZ }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
      - name: Test time-window, expiry, pagination, and delivery behavior
        run: python3 -m unittest discover -q
      - name: Restore migration seed
        id: seed
        if: inputs.mode == 'diagnose' || inputs.mode == 'bootstrap'
        run: python3 state_store.py restore --seed
      - name: Restore newest durable state
        id: restore
        if: inputs.mode != 'diagnose' && inputs.mode != 'bootstrap'
        run: python3 state_store.py restore
      - name: Validate cloud source
        if: inputs.mode == 'diagnose'
        run: |
          python3 cloud_probe.py
      - name: Check rolling 12-hour timeline
        id: check
        if: inputs.mode != 'diagnose'
        env:
          MONITOR_ACTION: ${{ inputs.mode == 'check-and-confirm' && 'check-and-confirm' || 'check' }}
        run: python3 monitor.py "$MONITOR_ACTION"
      - name: Prepare state even after source or delivery failure
        id: prepare
        if: always() && inputs.mode != 'diagnose' && (steps.seed.outcome == 'success' || steps.restore.outcome == 'success')
        run: python3 state_store.py prepare
      - name: Persist state
        id: upload
        if: always() && steps.prepare.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node 24
        with:
          name: monitor-state
          path: artifact/state.sqlite3
          if-no-files-found: error
          retention-days: 90
          compression-level: 9
          archive: true
      - name: Retain newest three snapshots
        if: always() && steps.upload.outcome == 'success'
        run: python3 state_store.py prune
      - name: Keep monthly repository activity for scheduled workflows
        if: steps.check.outcome == 'success'
        run: python3 state_store.py keepalive
      - name: Publish only sanitized outcome counters
        if: always()
        run: |
          python3 - <<'PY'
          import json, pathlib, os
          p = pathlib.Path('runtime/status.json')
          if p.exists():
              d = json.loads(p.read_text())
              safe = {k:d[k] for k in ['interval_seconds','timezone','active_window','lookback_hours','source_count','mail_mode','sources','counts','reported_at']}
              safe['health'] = {k:d['meta'].get(k,'') for k in ['last_fetch_ms','last_error','delivery_error','fetch_failures','configuration_mail_accepted_ms','delivered_message_count']}
              print(json.dumps(safe, ensure_ascii=False))
              with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
                  f.write('```json\n'+json.dumps(safe,ensure_ascii=False,indent=2)+'\n```\n')
          PY
